<title>Catálogo de Bebidas</title>
<meta property="og:title" content="Catálogo de Bebidas">
<meta property="og:description" content="Precios sujetos a posibles cambios">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Mismo armado que el catalogo de Softys, con fondo azul. Los precios no vienen de Gescom: se cargan a mano en BEBIDAS (abajo). */
:root{
  --bg:#000000; --fg:#14181f; --muted:#5b6472; --line:#dde2ea;
  --marca:#0B3D91; --claro:#9FD0FF; --blanco:#ffffff;
  --f-ui:"Archivo",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
html{scroll-padding-top:130px}
body{margin:0;background:var(--bg);color:var(--blanco);font-family:var(--f-ui);font-size:15px;line-height:1.35;padding:0 16px 48px}
.wrap{max-width:1100px;margin:0 auto}
header{padding-block:20px 12px}
h1{margin:0;font-size:1.3rem;font-weight:800;color:var(--blanco)}
.sub{margin:4px 0 0;color:#D5E4FF;font-size:.85rem}
/* fondo de neón solo detrás del encabezado y el buscador; la barra pegada al bajar vuelve a negro */
body::before{content:"";position:absolute;left:0;right:0;top:0;height:var(--alto-cab,230px);z-index:0;background:linear-gradient(rgba(0,0,0,.5),rgba(0,0,0,.5)),url(img/fondo-neon.jpg) center/auto 100% repeat-x #000;pointer-events:none}
.wrap{position:relative;z-index:1}
.arriba.pegada{background:var(--bg)!important}
.arriba{position:sticky;top:env(safe-area-inset-top,0px);z-index:2;background:transparent;margin:0 -16px;padding:10px 16px 0;border-bottom:1px solid rgba(255,255,255,.35)}
.linea{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap}
.buscar{display:block;flex:0 1 300px;min-width:0;width:100%;font:inherit;font-size:16px;padding:6px 10px;border:0;border-radius:8px;background:#fff;color:var(--fg)}
.pagos{display:flex;align-items:center;gap:6px 10px;flex-wrap:wrap;font-size:.8rem;color:#fff}
.pagos b{color:var(--claro)}
.pagos span{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border:1px solid rgba(255,255,255,.35);border-radius:999px;white-space:nowrap}
.pagos .mp{width:22px;height:auto;flex:0 0 auto}
.pagos svg{width:20px;height:14px;flex:0 0 auto}
.buscar:focus-visible{outline:3px solid var(--claro);outline-offset:1px}
.cuenta{font-size:.8rem;color:#D5E4FF;margin:6px 0 0}
nav{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:10px 0}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;font:inherit;font-size:.85rem;font-weight:600;cursor:pointer;color:var(--blanco);background:transparent;border:1.5px solid var(--blanco);border-radius:999px;padding:6px 12px;white-space:nowrap}
nav button.activa{background:var(--blanco);color:var(--marca)}
nav button:not([data-seg="todos"]).activa::before{content:"✓ "}
nav button:focus-visible{outline:3px solid var(--claro);outline-offset:2px}
section{margin-top:36px;padding-top:18px;border-top:3px solid var(--blanco)}
section:first-of-type{margin-top:20px}
h2{margin:0 0 14px;font-size:1.15rem;font-weight:800;letter-spacing:.03em;text-transform:uppercase;color:var(--blanco);display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h2 small,h3 small{font-size:.8rem;font-weight:500;color:#D5E4FF;text-transform:none;letter-spacing:0}
.tam{margin-top:22px;padding-top:12px;border-top:2px solid var(--claro)}
.tam:first-of-type{margin-top:6px}
h3{margin:0 0 12px;font-size:1rem;font-weight:800;color:var(--claro);display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.tam[hidden]{display:none!important}
.lista{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:700px){.lista{grid-template-columns:repeat(2,1fr)}}
@media (min-width:1050px){.lista{grid-template-columns:repeat(3,1fr)}}
.prod{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:center;padding:10px;background:#fff;color:var(--fg);border:1.5px solid var(--claro);border-radius:10px;min-width:0;break-inside:avoid;page-break-inside:avoid}
.foto{width:96px;height:96px;background:#fff;border:1px solid var(--line);border-radius:8px;display:grid;place-items:center;overflow:hidden}
.foto img{width:100%;height:100%;object-fit:contain;background:#fff}
.prod[hidden],section[hidden]{display:none!important}
.foto .sin{font-weight:800;font-size:.7rem;color:var(--marca);opacity:.45;letter-spacing:.05em;text-align:center;padding:4px;text-transform:uppercase}
.datos{min-width:0;display:flex;flex-direction:column;gap:3px}
.desc{font-weight:700;font-size:.95rem;overflow-wrap:anywhere}
.det{font-size:.75rem;color:var(--muted)}
.op{display:flex;flex-wrap:wrap;gap:2px 14px;margin-top:4px;align-items:baseline}
.precio{display:flex;align-items:baseline;gap:6px}
.precio span{font-size:.75rem;color:var(--muted)}
.precio b{font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:600}
.precio.bulto b{font-size:1.05rem;color:var(--marca)}
footer{margin-top:32px;color:#D5E4FF;font-size:.8rem}
header.cab{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.pdf{flex:0 0 auto;font:inherit;font-size:.85rem;font-weight:700;cursor:pointer;color:var(--marca);background:#fff;border:0;border-radius:10px;padding:9px 14px;white-space:nowrap}
.pdf:hover{filter:brightness(.92)}.pdf:focus-visible{outline:3px solid var(--claro);outline-offset:2px}
.pdf[disabled]{opacity:.6;cursor:wait}
/* bordes de las tarjetas y titulo cambiando de color todo el tiempo */
@keyframes bordes{0%{border-color:#FF4D4D}16%{border-color:#FFB020}33%{border-color:#FFE14D}50%{border-color:#4DDB6B}66%{border-color:#3BB3FF}83%{border-color:#B26BFF}100%{border-color:#FF4D4D}}
@keyframes letras{0%{color:#FF4D4D}16%{color:#FFB020}33%{color:#FFE14D}50%{color:#4DDB6B}66%{color:#3BB3FF}83%{color:#B26BFF}100%{color:#FF4D4D}}
.prod{border-width:2.5px;animation:bordes 6s linear infinite}
.tam{animation:bordes 6s linear infinite}
h1,h3{animation:letras 6s linear infinite}
@media (prefers-reduced-motion:reduce){.prod,.tam,h1,h3{animation-duration:30s}}/* WhatsApp al lado del boton del PDF */
.acciones{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.wasap{display:flex;align-items:center;gap:6px;color:#fff;text-decoration:none;font-weight:700;font-size:.9rem;white-space:nowrap}
.wasap img{width:28px;height:28px;border-radius:50%}
.wasap:hover span{text-decoration:underline}.wasap:focus-visible{outline:3px solid var(--claro);outline-offset:2px;border-radius:6px}
/* carrito: el cliente arma el pedido y lo manda por WhatsApp */
.agrs{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.agr{display:flex;align-items:center;gap:6px}
.sello{align-self:flex-start;font-size:.72rem;font-weight:800;letter-spacing:.03em;text-transform:uppercase;color:#7A4B00;background:#FFD54A;border-radius:999px;padding:3px 10px}
.prod.dest{box-shadow:0 0 0 3px #FFD54A}
.agr .et{font-size:.72rem;color:var(--muted);font-weight:700}
.agr .add.u{background:#fff;color:#128C4A;border:2px solid #25D366;padding:5px 10px}
.agr .add{font:inherit;font-size:.85rem;font-weight:700;cursor:pointer;color:#fff;background:#25D366;border:0;border-radius:8px;padding:7px 12px}
.agr .add:hover{filter:brightness(.93)}
.cant{display:inline-flex;align-items:center;border:2px solid #25D366;border-radius:8px;overflow:hidden}
.cant button{font:inherit;font-size:1.05rem;font-weight:800;width:34px;height:32px;border:0;background:#E9FBF0;color:#128C4A;cursor:pointer}
.cant input{width:46px;height:32px;border:0;text-align:center;font:inherit;font-weight:700;font-size:16px;color:var(--fg);-moz-appearance:textfield}
.cant input::-webkit-outer-spin-button,.cant input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.agr .add:focus-visible,.cant button:focus-visible,.cant input:focus-visible{outline:3px solid var(--claro);outline-offset:1px}
.barra-carro{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:5;display:flex;align-items:center;gap:12px;font:inherit;font-weight:800;font-size:1rem;color:#fff;background:#25D366;border:0;border-radius:999px;padding:12px 22px;box-shadow:0 6px 20px rgba(0,0,0,.45);cursor:pointer;max-width:calc(100% - 32px);white-space:nowrap}
.barra-carro[hidden],.carro[hidden],.fondo[hidden]{display:none}
body.con-carro{padding-bottom:90px}
.fondo{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:6}
.carro{position:fixed;right:0;top:0;bottom:0;width:min(440px,100%);z-index:7;background:#fff;color:var(--fg);display:flex;flex-direction:column;box-shadow:-6px 0 24px rgba(0,0,0,.4)}
.carro header{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}
.carro h2{color:var(--fg);margin:0;font-size:1.15rem}
.cerrar{font:inherit;font-size:1.4rem;line-height:1;border:0;background:none;cursor:pointer;color:var(--muted);padding:4px 8px}
.items{flex:1;overflow:auto;padding:6px 18px}
.it{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:10px 0;border-bottom:1px solid var(--line)}
.it .n{font-weight:700;font-size:.92rem}.it .u{font-size:.78rem;color:var(--muted)}
.it .s{font-family:var(--f-num);font-weight:600;text-align:right;align-self:center}
.it .quitar{font:inherit;font-size:.78rem;color:#C0392B;background:none;border:0;cursor:pointer;padding:0;justify-self:start}
.pie{padding:14px 18px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:grid;gap:9px}
.total{display:flex;justify-content:space-between;font-weight:800;font-size:1.1rem}.total b{font-family:var(--f-num)}
.pie label{font-size:.8rem;color:var(--muted);display:grid;gap:3px}
.pie input,.pie textarea{font:inherit;font-size:16px;color:var(--fg);border:1px solid #c9d0da;border-radius:8px;padding:8px 10px}
.pie textarea{min-height:52px;resize:vertical}
.enviar{font:inherit;font-weight:800;font-size:1rem;color:#fff;background:#25D366;border:0;border-radius:10px;padding:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.enviar img{width:22px;height:22px;border-radius:50%}
.vaciar{font:inherit;font-size:.82rem;color:var(--muted);background:none;border:0;cursor:pointer;text-decoration:underline}
.aviso{font-size:.75rem;color:var(--muted);margin:0}
.err{color:#C0392B;font-size:.82rem;font-weight:700;margin:0}
@media print{.agr,.barra-carro,.carro,.fondo{display:none!important}}
@media print{
  .prod,.tam,h1,h3{animation:none!important}
  @page{size:A4;margin:10mm}
  html,body{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{padding:0 4mm;font-size:11px}
  .pdf,.arriba{display:none!important}
  .lista{grid-template-columns:repeat(2,1fr);gap:6px}
  .prod{grid-template-columns:70px 1fr;padding:6px}
  .foto{width:70px;height:70px}
  section{break-inside:auto}
  h2,h3{break-after:avoid}
}
</style>
</head>

      ['Café al coñac Cusenier petaca', 'petaca-cafe-conac', [[24, 50400]]],
    ]],
  ]],
  ['Alfajores', [
    ['Alfajores', [
      ['Rasta negro', 'rasta-negro', [[18, 17800]]],
      ['Rasta blanco', 'rasta-blanco', [[18, 17800]]],
      ['Alfajor Recova negro', 'recova-negro', [[24, 15500]]],
      ['Alfajor Recova blanco', 'recova-blanco', [[24, 15500]]],
    ]],
  ]],
];
// productos que tambien se venden sueltos por unidad; el resto solo por bulto (pedido de Bruno, 31/10/2026)
const SUELTOS = /skyy|col.n selecto|m.s loco que una cabra|santa julia|cosecha tard|federico de alvear|new style|fernet (branca|1882 750)|corona botella 710|gin merle|smirnoff botella|gancia americano|licor de mel|whisky|caf. al co/i;
const FOTOS_V = '2';   // cambiar cuando se reemplazan las fotos
const fmt = new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',minimumFractionDigits:0,maximumFractionDigits:0});
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
function sinFoto(img, texto){ const s = document.createElement('span'); s.className = 'sin'; s.textContent = texto; img.replaceWith(s); }

const tarjeta = (p, cat, tam) => {
  const [nombre, foto, ops, dest] = p;
  const marca = nombre.split(/\s/)[0];
  const fotos = foto && foto !== '-' ? foto.split('|') : [];
  const img = foto === '-' ? '' : fotos.length ? `<img src="img/bebidas/${esc(fotos[0])}.jpg?v=${FOTOS_V}" alt="${esc(nombre)}" loading="lazy"${fotos.length > 1 ? ` data-fotos="${esc(foto)}"` : ''} onerror="sinFoto(this,'${esc(marca)}')">` : `<span class="sin">${esc(marca)}</span>`;
  const precios = ops.map(([u, pr]) => (u
    ? `<div class="op"><div class="precio bulto"><span>Bulto x${u}</span><b>${fmt.format(pr)}</b></div><div class="precio"><span>Unidad</span><b>${fmt.format(pr / u)}</b></div></div>`
    : `<div class="op"><div class="precio bulto"><span>Unidad</span><b>${fmt.format(pr)}</b></div></div>`)
    // por bulto siempre; suelto por unidad solo los de SUELTOS (al precio por unidad que se muestra)
    + `<div class="agrs">${u ? `<div class="agr" data-id="${esc(nombre + '|' + u)}" data-n="${esc(nombre)}" data-u="${u}" data-p="${pr}"></div>` : ''}${!u || SUELTOS.test(nombre) ? `<div class="agr" data-id="${esc(nombre + '|0')}" data-n="${esc(nombre)}" data-u="0" data-p="${u ? Math.round(pr / u) : pr}"></div>` : ''}</div>`).join('');
  return `<article class="prod${dest ? ' dest' : ''}" data-buscar="${esc(norm(nombre + ' ' + cat + ' ' + tam + (dest ? ' ' + dest : '')))}">
    <div class="foto">${img}</div>
    <div class="datos">
      ${dest ? '<div class="sello">⭐ Producto destacado</div>' : ''}
      <div class="desc">${esc(nombre)}</div>
      ${ops.some(o => o[0]) ? '' : '<div class="det">Precio por unidad</div>'}
      ${precios}
    </div>
  </article>`;
};
const cuenta = n => `${n} ${n === 1 ? 'producto' : 'productos'}`;
document.getElementById('cat').innerHTML = BEBIDAS.map(([cat, tams], i) => {
  const total = tams.reduce((s, t) => s + t[1].length, 0);
  // si la categoria tiene un solo grupo con su mismo nombre, no se repite el subtitulo
  const cuerpo = tams.map(([tam, prods]) => `
    <div class="tam">
      ${tams.length > 1 || tam !== cat ? `<h3>${esc(tam)} <small>${cuenta(prods.length)}</small></h3>` : ''}
      <div class="lista">${prods.map(p => tarjeta(p, cat, tam)).join('')}</div>
    </div>`).join('');
  return `<section id="s${i}"><h2>${esc(cat)} <small>${cuenta(total)}</small></h2>${cuerpo}</section>`;
}).join('');
document.getElementById('nav').innerHTML = `<button type="button" data-seg="todos" class="activa" aria-pressed="true">Todas</button>` +
  BEBIDAS.map(([cat], i) => `<button type="button" data-seg="s${i}" aria-pressed="false">${esc(cat)}</button>`).join('');

// Categorias tildadas: ninguna = se ven todas; una o varias = solo esas (se combinan con el buscador)
const elegidos = new Set();
function tildar(id){
  if (id === 'todos') elegidos.clear(); else if (elegidos.has(id)) elegidos.delete(id); else elegidos.add(id);
  document.querySelectorAll('nav button').forEach(b => {
    const on = b.dataset.seg === 'todos' ? elegidos.size === 0 : elegidos.has(b.dataset.seg);
    b.classList.toggle('activa', on); b.setAttribute('aria-pressed', on);
  });
  buscar();
  window.scrollTo({top: 0});
}
function buscar(){
  const q = norm(document.getElementById('q').value.trim());
  const palabras = q.split(/\s+/).filter(Boolean);
  let n = 0;
  document.querySelectorAll('section').forEach(sec => {
    const tildado = elegidos.size === 0 || elegidos.has(sec.id);
    let vis = 0;
    sec.querySelectorAll('.prod').forEach(pr => { const ok = tildado && palabras.every(w => pr.dataset.buscar.includes(w)); pr.hidden = !ok; if (ok) vis++; });
    sec.querySelectorAll('.tam').forEach(s => { s.hidden = !s.querySelector('.prod:not([hidden])'); });
    sec.hidden = vis === 0; n += vis;
  });
  const c = document.getElementById('cuenta');
  c.hidden = !(q || elegidos.size); c.textContent = n ? cuenta(n) : 'Ningún producto coincide con la búsqueda.';
}
document.querySelectorAll('nav button').forEach(b => b.addEventListener('click', () => tildar(b.dataset.seg)));
document.getElementById('q').addEventListener('input', buscar);
// el fondo de neón cubre hasta el final del buscador; cuando la barra queda pegada arriba se pone negra
{ const arr = document.querySelector('.arriba');
  const medir = () => { document.documentElement.style.setProperty('--alto-cab', (document.getElementById('cat').getBoundingClientRect().top + scrollY) + 'px'); pegar(); };
  const pegar = () => arr.classList.toggle('pegada', arr.getBoundingClientRect().top <= 1 && scrollY > 0);
  addEventListener('scroll', pegar, {passive: true}); addEventListener('resize', medir); medir(); }
// Productos con varias fotos (sabores): se turnan cada 2,5 segundos
let giro = 0;
setInterval(() => { giro++; document.querySelectorAll('img[data-fotos]').forEach(i => { const l = i.dataset.fotos.split('|'); i.src = `img/bebidas/${l[giro % l.length]}.jpg?v=${FOTOS_V}`; }); }, 2500);
document.querySelectorAll('img[data-fotos]').forEach(i => i.dataset.fotos.split('|').slice(1).forEach(n => { new Image().src = `img/bebidas/${n}.jpg?v=${FOTOS_V}`; }));

// ---------- Carrito: el cliente arma el pedido y lo manda por WhatsApp (pedido de Bruno, 31/10/2026) ----------
const WSP = '5491144386153', KCARRO = 'bebidas-carrito';
let CARRO = {};   // id -> {n, u, p, q}
try { CARRO = JSON.parse(localStorage.getItem(KCARRO) || '{}') || {}; } catch (e) { CARRO = {}; }
// se descartan productos que ya no estan en el catalogo o cambiaron de precio
{ const vig = {}; document.querySelectorAll('.agr').forEach(a => vig[a.dataset.id] = +a.dataset.p);
  for (const id of Object.keys(CARRO)) { if (!(id in vig)) delete CARRO[id]; else CARRO[id].p = vig[id]; } }
const guardar = () => { try { localStorage.setItem(KCARRO, JSON.stringify(CARRO)); } catch (e) {} };
const uTxt = u => +u ? `bulto x${u}` : 'unidad', uPl = (u, q) => +u ? (q === 1 ? 'bulto' : 'bultos') + ` x${u}` : (q === 1 ? 'unidad' : 'unidades');
function pintarAgr(a){
  const it = CARRO[a.dataset.id];
  a.innerHTML = it
    ? `<span class="et">${+a.dataset.u ? 'Bultos' : 'Unidades'}</span><div class="cant"><button type="button" data-d="-1" aria-label="Uno menos">−</button><input type="number" min="0" inputmode="numeric" value="${it.q}" aria-label="Cantidad de ${esc(a.dataset.n)} (${uTxt(a.dataset.u)})"><button type="button" data-d="1" aria-label="Uno más">+</button></div>`
    : `<button type="button" class="add${+a.dataset.u ? '' : ' u'}">🛒 Comprar ${+a.dataset.u ? 'bulto' : 'unidad'}</button>`;
}
function poner(id, q, a){
  q = Math.max(0, Math.floor(q) || 0);
  if (q) CARRO[id] = {n: a.dataset.n, u: +a.dataset.u, p: +a.dataset.p, q}; else delete CARRO[id];
  guardar(); document.querySelectorAll(`.agr[data-id="${CSS.escape(id)}"]`).forEach(pintarAgr); resumen();
}
function resumen(){
  const L = Object.values(CARRO), n = L.reduce((s, x) => s + x.q, 0), t = L.reduce((s, x) => s + x.q * x.p, 0);
  $b.hidden = !n; document.body.classList.toggle('con-carro', !!n);
  document.getElementById('barraTxt').textContent = `Ver pedido · ${n} ${n === 1 ? 'artículo' : 'artículos'} · ${fmt.format(t)}`;
  document.getElementById('total').textContent = fmt.format(t);
  document.getElementById('items').innerHTML = L.length ? Object.entries(CARRO).map(([id, x]) => `<div class="it" data-id="${esc(id)}">
      <div><div class="n">${esc(x.n)}</div><div class="u">${uTxt(x.u)} · ${fmt.format(x.p)}</div></div><div class="s">${fmt.format(x.q * x.p)}</div>
      <div class="cant"><button type="button" data-d="-1" aria-label="Uno menos">−</button><input type="number" min="0" inputmode="numeric" value="${x.q}" aria-label="Cantidad de ${esc(x.n)}"><button type="button" data-d="1" aria-label="Uno más">+</button></div>
      <button type="button" class="quitar">Quitar</button></div>`).join('') : '<p class="aviso" style="padding:16px 0">Todavía no agregaste productos.</p>';
}
const $b = document.getElementById('barra');
const agrDe = id => document.querySelector(`.agr[data-id="${CSS.escape(id)}"]`);
document.querySelectorAll('.agr').forEach(pintarAgr);
document.getElementById('cat').addEventListener('click', e => {
  const a = e.target.closest('.agr'); if (!a) return; const id = a.dataset.id, q = (CARRO[id] || {}).q || 0;
  if (e.target.closest('.add')) { poner(id, 1, a); a.querySelector('input')?.focus(); }
  else if (e.target.dataset.d) poner(id, q + +e.target.dataset.d, a);
});
document.getElementById('cat').addEventListener('change', e => { const a = e.target.closest('.agr'); if (a && e.target.matches('input')) poner(a.dataset.id, +e.target.value, a); });
document.getElementById('items').addEventListener('click', e => {
  const it = e.target.closest('.it'); if (!it) return; const id = it.dataset.id, x = CARRO[id], a = agrDe(id); if (!x || !a) return;
  if (e.target.closest('.quitar')) poner(id, 0, a); else if (e.target.dataset.d) poner(id, x.q + +e.target.dataset.d, a);
});
document.getElementById('items').addEventListener('change', e => { const it = e.target.closest('.it'), a = it && agrDe(it.dataset.id); if (a && e.target.matches('input')) poner(it.dataset.id, +e.target.value, a); });
const panel = document.getElementById('carro'), fondo = document.getElementById('fondo');
function abrir(){ panel.hidden = fondo.hidden = false; document.getElementById('cerrar').focus(); }
function cerrar(){ panel.hidden = fondo.hidden = true; $b.focus(); }
$b.addEventListener('click', abrir); fondo.addEventListener('click', cerrar); document.getElementById('cerrar').addEventListener('click', cerrar);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !panel.hidden) cerrar(); });
document.getElementById('vaciar').addEventListener('click', () => { if (confirm('¿Vaciar el pedido?')) { CARRO = {}; guardar(); document.querySelectorAll('.agr').forEach(pintarAgr); resumen(); } });
// datos del cliente: se recuerdan en este telefono para el proximo pedido
const CAMPOS = ['cNom', 'cCod', 'cDir'];
try { const d = JSON.parse(localStorage.getItem('bebidas-cliente') || '{}'); CAMPOS.forEach(k => { if (d[k]) document.getElementById(k).value = d[k]; }); } catch (e) {}
document.getElementById('enviar').addEventListener('click', () => {
  const L = Object.values(CARRO), v = k => document.getElementById(k).value.trim(), err = document.getElementById('cErr');
  if (!L.length) { err.textContent = 'Agregá al menos un producto.'; return; }
  if (!v('cNom')) { err.textContent = 'Poné tu nombre o el de tu comercio.'; document.getElementById('cNom').focus(); return; }
  err.textContent = '';
  try { localStorage.setItem('bebidas-cliente', JSON.stringify(Object.fromEntries(CAMPOS.map(k => [k, v(k)])))); } catch (e) {}
  const t = L.reduce((s, x) => s + x.q * x.p, 0);
  const txt = ['*Pedido · Catálogo de Bebidas*', '', `Cliente: ${v('cNom')}`, v('cCod') ? `Código: ${v('cCod')}` : '', v('cDir') ? `Dirección: ${v('cDir')}` : '', '',
    ...L.map(x => `• ${x.q} ${uPl(x.u, x.q)} — ${x.n} — ${fmt.format(x.q * x.p)}`), '', `*Total: ${fmt.format(t)}*`, v('cObs') ? `\nComentarios: ${v('cObs')}` : '']
    .filter((l, i, a) => l !== '' || (a[i - 1] !== '' && i > 0)).join('\n');
  window.open(`https://wa.me/${WSP}?text=${encodeURIComponent(txt)}`, '_blank', 'noopener');
});
resumen();

// Descargar PDF: carga todas las fotos (vienen diferidas) y abre "Guardar como PDF" con el nombre del catalogo y la fecha
async function descargarPDF(){
  const b=document.getElementById('btnPdf'); b.disabled=true; const t0=b.textContent; b.textContent='Preparando…';
  const imgs=[...document.images]; imgs.forEach(i=>{ i.loading='eager'; });
  await Promise.race([Promise.all(imgs.map(i=>i.complete? 0 : new Promise(r=>{ i.addEventListener('load',r,{once:true}); i.addEventListener('error',r,{once:true}); }))), new Promise(r=>setTimeout(r,10000))]);
  const tit=document.title, h=new Date(Date.now()-3*3600e3).toISOString().slice(0,10).split('-').reverse().join('-');
  document.title='Catálogo de Bebidas';
  b.disabled=false; b.textContent=t0;
  window.print(); setTimeout(()=>{ document.title=tit; },1000);
}
</script>
